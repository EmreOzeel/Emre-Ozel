version: '3.8'

# Production compose for Ubuntu 22.04 deployment.
#
# Prerequisites:
#   1. Copy .env.production.example → .env and fill in ALL required values.
#   2. Obtain SSL certs (Let's Encrypt recommended):
#        sudo certbot certonly --standalone -d pcap.yourcompany.com
#      Or place certs manually at ./nginx/ssl/fullchain.pem + privkey.pem.
#   3. (Optional) Place GeoLite2 .mmdb files at ./geoip/ directory.
#   4. docker compose -f docker-compose.prod.yml up -d
#
# Ports exposed to host:
#   80, 443  — HTTP/HTTPS (nginx)
#   5514     — Syslog UDP+TCP (collector)
#   2055     — NetFlow/IPFIX UDP (if enabled)

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pcap-postgres
    restart: always
    environment:
      POSTGRES_DB: pcap_analyzer
      POSTGRES_USER: pcap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcap -d pcap_analyzer"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports exposed — internal only

  # ── Backend (FastAPI + collector) ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pcap-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENV=production
      - PORT=8000
      - DATABASE_URL=postgresql://pcap:${POSTGRES_PASSWORD}@postgres:5432/pcap_analyzer
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - JWT_EXPIRE_HOURS=${JWT_EXPIRE_HOURS:-24}
      - DEFAULT_USER=${DEFAULT_USER:-admin}
      - DEFAULT_PASS=${DEFAULT_PASS:?Set DEFAULT_PASS in .env}
      - UPLOAD_DIR=/data/uploads
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-500}
      - ANALYSIS_TIMEOUT_SEC=${ANALYSIS_TIMEOUT_SEC:-300}
      - MAX_ANALYSES_PER_USER=${MAX_ANALYSES_PER_USER:-0}
      - ALLOWED_ORIGINS=https://${DOMAIN:?Set DOMAIN in .env}
      # Collector
      - COLLECTOR_ENABLED=${COLLECTOR_ENABLED:-true}
      - SYSLOG_HOST=0.0.0.0
      - SYSLOG_PORT=5514
      - COLLECTOR_FLUSH_INTERVAL=1.0
      - COLLECTOR_BATCH_SIZE=100
      - COLLECTOR_DEVICE_ROLE=${COLLECTOR_DEVICE_ROLE:-perimeter}
      - RETENTION_DAYS=${RETENTION_DAYS:-30}
      - NETFLOW_ENABLED=${NETFLOW_ENABLED:-false}
      - NETFLOW_PORT=2055
      # GeoIP
      - GEOIP_ENABLED=${GEOIP_ENABLED:-true}
      - GEOIP_USE_IPAPI_FALLBACK=true
      - GEOIP_CITY_DB=/data/geoip/GeoLite2-City.mmdb
      - GEOIP_ASN_DB=/data/geoip/GeoLite2-ASN.mmdb
      # Packet Engine
      - PACKET_ENGINE_TOKEN=${PACKET_ENGINE_TOKEN:-}
      - PACKET_ENGINE_URL=http://packet-engine:8080
      # Analysis
      - TSHARK_PATH=/usr/bin/tshark
    volumes:
      - pcap_data:/data
      - ./geoip:/data/geoip:ro
    ports:
      - "5514:5514/udp"
      - "5514:5514/tcp"
      - "2055:2055/udp"
    networks:
      - internal
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Port 8000 NOT exposed — nginx proxies internally

  # ── Frontend (Vue SPA via nginx) ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pcap-frontend
    restart: always
    networks:
      - internal
    depends_on:
      - backend
    # No ports exposed — nginx proxies internally

  # ── Go Backend (migration target) ─────────────────────────────────────────
  go-backend:
    build:
      context: ./go-backend
      dockerfile: Dockerfile
    container_name: pcap-go-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENV=production
      - PORT=8000
      - DATABASE_URL=postgresql://pcap:${POSTGRES_PASSWORD}@postgres:5432/pcap_analyzer
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE_HOURS=${JWT_EXPIRE_HOURS:-24}
      - DEFAULT_USER=${DEFAULT_USER:-admin}
      - DEFAULT_PASS=${DEFAULT_PASS}
      - UPLOAD_DIR=/data/uploads
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-500}
      - ANALYSIS_TIMEOUT_SEC=${ANALYSIS_TIMEOUT_SEC:-300}
      - ALLOWED_ORIGINS=https://${DOMAIN}
      - COLLECTOR_ENABLED=false
      - RETENTION_DAYS=${RETENTION_DAYS:-30}
      - PACKET_ENGINE_TOKEN=${PACKET_ENGINE_TOKEN:-}
      - PACKET_ENGINE_URL=http://packet-engine:8080
      - FEATURE_COLLECTOR=false
      - FEATURE_CAUSAL_PATH=false
      - FEATURE_MONITOR_RUN=false
    volumes:
      - pcap_data:/data
      - ./geoip:/data/geoip:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: pcap-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - go-backend
      - frontend
    environment:
      - MIGRATION_PHASE=${MIGRATION_PHASE:-0}
    networks:
      - internal

  # ── Go Packet Engine ──────────────────────────────────────────────────────
  packet-engine:
    build:
      context: ./go-packet-engine
      dockerfile: Dockerfile
    container_name: pcap-packet-engine
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - PACKET_INTERFACE=${PACKET_INTERFACE:-eth1}
      - BACKEND_URL=http://backend:8000
      - BACKEND_TOKEN=${PACKET_ENGINE_TOKEN}
      - PACKET_BPF_FILTER=${PACKET_BPF_FILTER:-}
      - PACKET_BATCH_SIZE=100
      - PACKET_FLUSH_INTERVAL=1s
      - PACKET_FLOW_TIMEOUT=60s
      - PACKET_WORKERS=4
    network_mode: host
      # host network required for raw packet capture
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /data/triggered:/data/triggered

volumes:
  postgres_data:
    driver: local
  pcap_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  internal:
    driver: bridge
    internal: false   # nginx needs outbound for OCSP stapling
