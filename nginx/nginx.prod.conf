worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;

    # ── Upload size limit ─────────────────────────────────────────────────────
    client_max_body_size 600m;

    # ── Backend upstreams ─────────────────────────────────────────────────────
    upstream python_backend {
        server backend:8000;
    }

    upstream go_backend {
        server go-backend:8000;
    }

    # ── Migration phase routing ───────────────────────────────────────────────
    # MIGRATION_PHASE controls which backend handles API traffic:
    #   0 = all traffic to Python (default, pre-migration)
    #   1 = migrated routes to Go, rest to Python
    #   2 = all traffic to Go (post-migration)
    #
    # Set via env var: MIGRATION_PHASE=0|1|2
    map $host $migration_phase {
        default "${MIGRATION_PHASE}";
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name ${DOMAIN};
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name ${DOMAIN};

        # SSL certificates — Let's Encrypt or manual placement
        ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # ── Security headers ──────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' cdnjs.cloudflare.com; img-src 'self' data: tile.openstreetmap.org *.tile.openstreetmap.org; connect-src 'self';" always;

        client_max_body_size 600m;

        # ── Frontend SPA ──────────────────────────────────────────────────────
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_intercept_errors on;
            error_page 404 = @spa_fallback;
        }

        location @spa_fallback {
            proxy_pass http://frontend:80/;
        }

        # ── Phase 2: ALL API traffic to Go ────────────────────────────────────
        # When MIGRATION_PHASE=2, everything goes to Go backend.

        # ── Phase 1: Migrated routes → Go backend ────────────────────────────
        # These routes are fully implemented and verified in Go.
        # Active only when MIGRATION_PHASE=1 or 2.
        location ~ ^/api/(auth|health) {
            if ($migration_phase = "0") {
                proxy_pass http://python_backend;
                break;
            }
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://go_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;
        }

        location ~ ^/api/(live-events|live-flows|live-incidents|notifications|suppressions|work-queue|dashboard|correlation-rules|threat-indicators|threat-feeds|baselines|geo|attack-sessions|users) {
            if ($migration_phase = "0") {
                proxy_pass http://python_backend;
                break;
            }
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://go_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # ── API — file upload (higher timeout, separate rate limit) ───────────
        location /api/analyses {
            # Phase 1+2: analyses go to Go backend
            set $analyses_backend python_backend;
            if ($migration_phase != "0") {
                set $analyses_backend go_backend;
            }
            limit_req zone=upload burst=5 nodelay;
            proxy_pass http://$analyses_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;
            client_max_body_size 600m;
        }

        # ── API — fallback: everything else to Python ─────────────────────────
        # Catches: ingest, collector, pcap-trigger, packet-engine, path-analysis,
        # path-monitors, telemetry, and any new endpoints not yet migrated.
        location /api/ {
            # Phase 2: all to Go
            set $fallback_backend python_backend;
            if ($migration_phase = "2") {
                set $fallback_backend go_backend;
            }
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://$fallback_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_request_buffering off;
        }
    }
}
