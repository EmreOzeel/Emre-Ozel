services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: pcap-backend
    restart: unless-stopped
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - DEFAULT_USER=${DEFAULT_USER:-admin}
      - DEFAULT_PASS=${DEFAULT_PASS:-admin123}
      - DB_PATH=/data/pcap.db
      - UPLOAD_DIR=/data/uploads
      # ── Live collector ──────────────────────────────────────────────
      - COLLECTOR_ENABLED=${COLLECTOR_ENABLED:-true}
      - SYSLOG_HOST=${SYSLOG_HOST:-0.0.0.0}
      - SYSLOG_PORT=${SYSLOG_PORT:-5514}
      - COLLECTOR_FLUSH_INTERVAL=${COLLECTOR_FLUSH_INTERVAL:-1.0}
      - COLLECTOR_BATCH_SIZE=${COLLECTOR_BATCH_SIZE:-100}
      - COLLECTOR_SOURCE_ID=${COLLECTOR_SOURCE_ID:-}
      - COLLECTOR_DEVICE_ROLE=${COLLECTOR_DEVICE_ROLE:-perimeter}
      - RETENTION_DAYS=${RETENTION_DAYS:-7}
    ports:
      - "5514:5514/udp"
      - "5514:5514/tcp"
    volumes:
      - pcap-data:/data
    networks:
      - pcap-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    container_name: pcap-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pcap-net

volumes:
  pcap-data:
    driver: local

networks:
  pcap-net:
    driver: bridge
